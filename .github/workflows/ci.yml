# Checks on every pull request, and before every image build (image.yml
# calls this workflow): lint, formatting, types, the tests (against the
# fake bunq API; nothing here reaches bunq), the TypeScript build, and the
# container image built, started read-only and probed, without pushing.
# Every action is pinned by commit.

name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g --no-update-notifier pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  image:
    name: container image (not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: bunq-mcp:ci
      - name: Start it read-only and check its health and its 404
        run: |
          docker run -d --name bunq-mcp -p 127.0.0.1:8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -e BUNQ_API_KEY=sandbox_0000000000000000000000000000000000000000000000 \
            -e BUNQ_ENVIRONMENT=sandbox \
            -e MCP_AUTH_TOKEN=ci-token-0123456789abcdef \
            bunq-mcp:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)" = 401
          test "$(docker exec bunq-mcp id -u)" = 10001
          docker logs bunq-mcp
          docker rm -f bunq-mcp
